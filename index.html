const FONT = "'JetBrains Mono', 'SF Mono', 'Fira Code', monospace";

function getWeekStart(date) {
  const d = new Date(date); const day = d.getDay();
  d.setDate(d.getDate() - day + (day === 0 ? -6 : 1)); d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function getTodayIndex() { const d = new Date().getDay(); return d === 0 ? 6 : d - 1; }

// ─── MACRO RING ───
function MacroRing({ value, max, color, label, unit }) {
  const pct = Math.min(value/max,1), r=32, circ=2*Math.PI*r, off=circ*(1-pct);
  return (
    <div style={{ textAlign:"center", flex:1 }}>
      <svg width="76" height="76" viewBox="0 0 76 76">
        <circle cx="38" cy="38" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="5"/>
        <circle cx="38" cy="38" r={r} fill="none" stroke={value>max?"#e94560":color} strokeWidth="5"
          strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off}
          transform="rotate(-90 38 38)" style={{transition:"stroke-dashoffset 0.5s ease"}}/>
        <text x="38" y="35" textAnchor="middle" fill="#fff" fontSize="14" fontWeight="800" fontFamily={FONT}>{value}</text>
        <text x="38" y="48" textAnchor="middle" fill="#748cab" fontSize="9" fontFamily={FONT}>/{max}{unit}</text>
      </svg>
      <div style={{fontSize:"10px",color:"#748cab",marginTop:"2px",textTransform:"uppercase",letterSpacing:"1px"}}>{label}</div>
    </div>
  );
}

// ─── TRAINING VIEW ───
function TrainingView({ selectedDay, data, setData }) {
  const [timerActive, setTimerActive] = useState(false);
  const [timerSec, setTimerSec] = useState(90);
  const [timerMax, setTimerMax] = useState(90);
  const wk = getWeekStart(new Date());
  const wo = WORKOUT_PLAN[selectedDay];
  const toggleSet = (ei,si) => { const k=`${wk}-${selectedDay}-${ei}-${si}`; setData(p=>({...p,sets:{...p.sets,[k]:!p.sets[k]}})); };
  const isSetDone = (ei,si) => !!data.sets[`${wk}-${selectedDay}-${ei}-${si}`];
  const allDone = (di) => { const w=WORKOUT_PLAN[di]; if(w.type==="rest") return false; return w.exercises.every((ex,ei)=>Array.from({length:ex.sets},(_,si)=>data.sets[`${wk}-${di}-${ei}-${si}`]).every(Boolean)); };
  const markDone = () => setData(p=>({...p,days:{...p.days,[`${wk}-${selectedDay}`]:true}}));
  const isDone = data.days[`${wk}-${selectedDay}`] || allDone(selectedDay);
  const cnt = Array.from({length:7},(_,i)=>(data.days[`${wk}-${i}`]||allDone(i))?1:0).reduce((a,b)=>a+b,0);
  useEffect(()=>{let iv; if(timerActive&&timerSec>0) iv=setInterval(()=>setTimerSec(s=>s-1),1000); else if(timerSec===0) setTimerActive(false); return()=>clearInterval(iv);},[timerActive,timerSec]);
  const startT=(s)=>{setTimerMax(s);setTimerSec(s);setTimerActive(true);};
  const tc={lift:{a:"#e94560",g:"rgba(233,69,96,0.3)"},cardio:{a:"#0fff95",g:"rgba(15,255,149,0.3)"},rest:{a:"#748cab",g:"rgba(116,140,171,0.2)"}};
  const c=tc[wo.type]; const ico={lift:"🏋️",cardio:"🏃",rest:"😴"};
  return (
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:"12px"}}>
        <div style={{background:"rgba(233,69,96,0.15)",border:"1px solid rgba(233,69,96,0.3)",borderRadius:"8px",padding:"6px 12px",fontSize:"11px",color:"#e94560",fontWeight:600}}>{cnt}/6 done</div>
      </div>
      <div style={{background:"#1a1a2e",borderRadius:"16px",border:`1px solid ${c.a}20`,overflow:"hidden",boxShadow:`0 8px 32px ${c.g}`}}>
        <div style={{padding:"20px",background:`linear-gradient(135deg,${c.a}10 0%,transparent 60%)`,borderBottom:`1px solid ${c.a}15`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontSize:"12px",color:"#748cab",marginBottom:"4px"}}>{DAY_NAMES[selectedDay]} -- {wo.type.toUpperCase()}</div>
              <div style={{fontSize:"26px",fontWeight:800,color:"#fff",lineHeight:1.1}}>{ico[wo.type]} {wo.name}</div>

function WeeklyView({ data }) {
  const wk = getWeekStart(new Date());
  const accent = "#8b5cf6";

  const getDayData = (i) => {
    const dk = `${wk}-${i}`;
    const wo = WORKOUT_PLAN[i];
    const isRest = wo.type === "rest";
    const woDone = isRest || data.days[dk] || (wo.exercises.length > 0 && wo.exercises.every((ex, ei) => Array.from({length: ex.sets}, (_, si) => data.sets[`${wk}-${i}-${ei}-${si}`]).every(Boolean)));
    const meals = data.meals[dk] || [];
    const cal = meals.reduce((a, m) => a + m.cal, 0);
    const calHit = cal > 0 && Math.abs(cal - TARGETS.calories) / TARGETS.calories <= 0.05;
    const steps = data.steps[dk] || 0;
    const acts = data.activities[dk] || [];
    return { isRest, woDone, cal, calHit, steps, acts, name: wo.name };
  };

  const days = Array.from({length: 7}, (_, i) => ({...getDayData(i), idx: i}));
  const woCount = days.filter(d => !d.isRest && d.woDone).length;
  const calCount = days.filter(d => d.calHit).length;
  const stepCount = days.filter(d => d.steps >= 10000).length;
  const totalScore = Math.round(((woCount / 6) * 50 + (calCount / 7) * 30 + (stepCount / 7) * 20));
  const grade = totalScore >= 90 ? "A" : totalScore >= 80 ? "B" : totalScore >= 70 ? "C" : totalScore >= 60 ? "D" : "F";
  const gradeColor = grade === "A" ? "#0fff95" : grade === "B" ? "#f0a500" : grade === "C" ? "#f0a500" : "#e94560";

  // Streak
  const today = getTodayIndex();
  let streak = 0;
  for (let i = today; i >= 0; i--) {
    const d = getDayData(i);
    if (d.isRest || d.woDone) streak++;
    else break;
  }

  return (
    <div>
      {/* Weekly grade */}
      <div style={{...card(`${accent}20`), boxShadow: `0 8px 32px ${accent}20`, padding: "20px", textAlign: "center"}}>
        <div style={sLabel(accent)}>This Week</div>
        <div style={{fontSize: "64px", fontWeight: 900, color: gradeColor, lineHeight: 1}}>{grade}</div>
        <div style={{fontSize: "12px", color: "#748cab", marginTop: "8px"}}>Score: {totalScore}/100</div>
        <div style={{display: "flex", gap: "12px", justifyContent: "center", marginTop: "16px"}}>
          <div style={{textAlign: "center"}}><div style={{fontSize: "18px", fontWeight: 800, color: "#e94560"}}>{woCount}/6</div><div style={{fontSize: "9px", color: "#748cab", textTransform: "uppercase"}}>Workouts</div></div>
          <div style={{textAlign: "center"}}><div style={{fontSize: "18px", fontWeight: 800, color: "#f0a500"}}>{calCount}/7</div><div style={{fontSize: "9px", color: "#748cab", textTransform: "uppercase"}}>Nutrition</div></div>
          <div style={{textAlign: "center"}}><div style={{fontSize: "18px", fontWeight: 800, color: "#0fff95"}}>{stepCount}/7</div><div style={{fontSize: "9px", color: "#748cab", textTransform: "uppercase"}}>Step Goal</div></div>
        </div>
        {streak > 1 && <div style={{marginTop: "14px", padding: "8px 14px", background: "rgba(15,255,149,0.1)", borderRadius: "8px", display: "inline-block"}}><span style={{fontSize: "13px", color: "#0fff95", fontWeight: 700}}>🔥 {streak} day streak</span></div>}
      </div>

      {/* Daily breakdown */}
      {days.map(d => (
        <div key={d.idx} style={{...card(), padding: "14px"}}>
          <div style={{display: "flex", justifyContent: "space-between", alignItems: "center"}}>
            <div style={{display: "flex", alignItems: "center", gap: "10px"}}>
              <div style={{fontSize: "13px", fontWeight: 700, color: "#fff", width: "32px"}}>{DAY_NAMES[d.idx]}</div>
              <div style={{fontSize: "12px", color: "#748cab"}}>{d.name}</div>
            </div>
            <div style={{display: "flex", gap: "6px"}}>
              {!d.isRest && <div style={{width: "20px", height: "20px", borderRadius: "4px", background: d.woDone ? "#0fff9520" : "rgba(255,255,255,0.04)", border: d.woDone ? "1px solid #0fff95" : "1px solid rgba(255,255,255,0.08)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "10px", color: d.woDone ? "#0fff95" : "#4a5568"}}>{d.woDone ? "✓" : ""}</div>}
              <div style={{width: "20px", height: "20px", borderRadius: "4px", background: d.calHit ? "#f0a50020" : "rgba(255,255,255,0.04)", border: d.calHit ? "1px solid #f0a500" : "1px solid rgba(255,255,255,0.08)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "10px", color: d.calHit ? "#f0a500" : "#4a5568"}}>{d.calHit ? "✓" : ""}</div>
            </div>
          </div>
          <div style={{display: "flex", gap: "16px", marginTop: "8px", fontSize: "11px", color: "#4a5568"}}>
            <span>{d.steps > 0 ? `${d.steps.toLocaleString()} steps` : "No steps"}</span>
            <span>{d.cal > 0 ? `${d.cal} cal` : "No meals"}</span>
            {d.acts.length > 0 && <span>{d.acts.map(a => a.name).join(", ")}</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

function MonthlyView({ data }) {
  const accent = "#8b5cf6";
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const monthName = now.toLocaleString("default", { month: "long" });
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDow = new Date(year, month, 1).getDay();
  const startOff = firstDow === 0 ? 6 : firstDow - 1;
  const badges = data.badges || [];

  const getDayStatus = (dayNum) => {
    const d = new Date(year, month, dayNum);
    const dow = d.getDay();
    const dayIdx = dow === 0 ? 6 : dow - 1;
    const wk = getWeekStart(d);
    const dk = `${wk}-${dayIdx}`;
    const wo = WORKOUT_PLAN[dayIdx];
    const isRest = wo.type === "rest";
    const woDone = isRest || data.days[dk] || false;
    const meals = data.meals[dk] || [];
    const cal = meals.reduce((a, m) => a + m.cal, 0);
    const calHit = cal > 0 && Math.abs(cal - TARGETS.calories) / TARGETS.calories <= 0.05;
    return { woDone, calHit, isRest };
  };

  // Monthly stats
  let woDays = 0, calDays = 0, totalDays = 0;
  for (let d = 1; d <= Math.min(daysInMonth, now.getDate()); d++) {
    const s = getDayStatus(d);
    totalDays++;
    if (s.woDone) woDays++;
    if (s.calHit) calDays++;
  }
  const woPct = totalDays > 0 ? Math.round((woDays / totalDays) * 100) : 0;
  // Current month progress badge (not stored yet, just a preview)
  const currentBadge = woPct === 100 ? { icon: "🥇", label: "Gold", color: "#f0a500" } : woPct >= 95 ? { icon: "🥈", label: "Silver", color: "#c0c0c0" } : woPct >= 90 ? { icon: "🥉", label: "Bronze", color: "#cd7f32" } : null;

  const cells = [];
  for (let i = 0; i < startOff; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  return (
    <div>
      {/* Earned Badges */}
      {badges.length > 0 && (
        <div style={card()}>
          <div style={sLabel("#f0a500")}>Earned Badges</div>
          <div style={{display: "flex", gap: "10px", flexWrap: "wrap"}}>
            {badges.map((b, i) => (
              <div key={i} style={{textAlign: "center", padding: "10px 14px", background: `${b.color}10`, border: `1px solid ${b.color}30`, borderRadius: "12px", minWidth: "70px"}}>
                <div style={{fontSize: "28px"}}>{b.icon}</div>
                <div style={{fontSize: "10px", fontWeight: 700, color: b.color, marginTop: "4px"}}>{b.label}</div>
                <div style={{fontSize: "9px", color: "#748cab", marginTop: "2px"}}>{b.month} {b.year}</div>
                <div style={{fontSize: "8px", color: "#4a5568", marginTop: "2px"}}>{b.woPct}% workout · {b.calPct}% nutrition</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Don't Break the Chain */}
      <div style={card()}>
        <div style={sLabel()}>Don't Break the Chain</div>
        <div style={{display: "flex", gap: "3px", flexWrap: "wrap"}}>
          {Array.from({length: Math.min(daysInMonth, now.getDate())}, (_, i) => {
            const s = getDayStatus(i + 1);
            const done = s.woDone;
            return <div key={i} style={{width: "12px", height: "12px", borderRadius: "3px", background: done ? "#0fff95" : "#e9456040", transition: "background 0.2s"}} />;
          })}
        </div>
      </div>

      {/* Main calendar card */}
      <div style={{...card(`${accent}20`), padding: "20px"}}>
        <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px"}}>
          <div><div style={sLabel(accent)}>{monthName} {year}</div><div style={{fontSize: "16px", fontWeight: 700, color: "#fff"}}>Monthly Overview</div></div>
          {currentBadge && <div style={{textAlign: "center"}}><div style={{fontSize: "22px"}}>{currentBadge.icon}</div><div style={{fontSize: "8px", color: currentBadge.color, fontWeight: 600}}>On pace</div></div>}
        </div>

        {/* Calendar grid */}
        <div style={{display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: "4px", marginBottom: "16px"}}>
          {DAY_NAMES.map(d => <div key={d} style={{textAlign: "center", fontSize: "9px", color: "#4a5568", padding: "4px 0"}}>{d}</div>)}
          {cells.map((day, i) => {
            if (day === null) return <div key={`e${i}`} />;
            const s = getDayStatus(day);
            const isToday = day === now.getDate();
            const isPast = day <= now.getDate();
            return (
              <div key={day} style={{aspectRatio: "1", borderRadius: "6px", border: isToday ? `2px solid ${accent}` : "1px solid rgba(255,255,255,0.04)", background: isPast ? (s.woDone && s.calHit ? "rgba(15,255,149,0.2)" : s.woDone ? "rgba(15,255,149,0.1)" : s.calHit ? "rgba(240,165,0,0.1)" : "rgba(255,255,255,0.02)") : "rgba(255,255,255,0.01)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", position: "relative"}}>
                <div style={{fontSize: "10px", color: isToday ? accent : isPast ? "#748cab" : "#2a2a3e", fontWeight: isToday ? 700 : 400}}>{day}</div>
                {isPast && (
                  <div style={{display: "flex", gap: "2px", marginTop: "2px"}}>
                    {!s.isRest && <div style={{width: "5px", height: "5px", borderRadius: "50%", background: s.woDone ? "#0fff95" : "rgba(255,255,255,0.1)"}} />}
                    <div style={{width: "5px", height: "5px", borderRadius: "50%", background: s.calHit ? "#f0a500" : "rgba(255,255,255,0.1)"}} />
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Legend */}
        <div style={{display: "flex", gap: "16px", justifyContent: "center", fontSize: "10px", color: "#748cab"}}>
          <div style={{display: "flex", alignItems: "center", gap: "4px"}}><div style={{width: "8px", height: "8px", borderRadius: "50%", background: "#0fff95"}} /> Workout</div>
          <div style={{display: "flex", alignItems: "center", gap: "4px"}}><div style={{width: "8px", height: "8px", borderRadius: "50%", background: "#f0a500"}} /> Nutrition</div>
        </div>

        {/* Monthly summary stats */}
        <div style={{marginTop: "16px", padding: "14px", background: "rgba(255,255,255,0.03)", borderRadius: "10px"}}>
          <div style={{display: "flex", justifyContent: "space-around", textAlign: "center"}}>
            <div><div style={{fontSize: "20px", fontWeight: 800, color: "#0fff95"}}>{woPct}%</div><div style={{fontSize: "9px", color: "#748cab", textTransform: "uppercase"}}>Workout Rate</div></div>
            <div><div style={{fontSize: "20px", fontWeight: 800, color: "#f0a500"}}>{totalDays > 0 ? Math.round((calDays/totalDays)*100) : 0}%</div><div style={{fontSize: "9px", color: "#748cab", textTransform: "uppercase"}}>Nutrition Rate</div></div>
            <div><div style={{fontSize: "20px", fontWeight: 800, color: accent}}>{woDays}</div><div style={{fontSize: "9px", color: "#748cab", textTransform: "uppercase"}}>Days Trained</div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function BodyView({ data, setData }) {
  const accent = "#8b5cf6";
  const [weightInput, setWeightInput] = useState("");
  const [prExercise, setPrExercise] = useState("");
  const [prWeight, setPrWeight] = useState("");

  const addWeight = () => {
    if (!weightInput) return;
    const entry = { date: new Date().toLocaleDateString(), weight: parseFloat(weightInput), id: Date.now() };
    setData(p => ({...p, weights: [...(p.weights || []), entry]}));
    setWeightInput("");
  };

  const addPR = () => {
    if (!prExercise || !prWeight) return;
    setData(p => ({...p, prs: {...(p.prs || {}), [prExercise]: { weight: parseFloat(prWeight), date: new Date().toLocaleDateString() }}}));
    setPrExercise(""); setPrWeight("");
  };

  const weights = data.weights || [];
  const prs = data.prs || {};
  const allExercises = [];
  Object.values(WORKOUT_PLAN).forEach(w => w.exercises.forEach(e => { if (!allExercises.includes(e.name)) allExercises.push(e.name); }));

  const startWeight = 217;
  const currentWeight = weights.length > 0 ? weights[weights.length - 1].weight : startWeight;
  const totalLost = startWeight - currentWeight;

  return (
    <div>
      {/* Weight tracker */}
      <div style={{...card(`${accent}20`), padding: "20px"}}>
        <div style={sLabel(accent)}>Weight Tracker</div>
        <div style={{display: "flex", justifyContent: "space-around", textAlign: "center", marginBottom: "16px"}}>
          <div><div style={{fontSize: "28px", fontWeight: 800, color: "#fff"}}>{currentWeight}</div><div style={{fontSize: "9px", color: "#748cab", textTransform: "uppercase"}}>Current (lb)</div></div>
          <div><div style={{fontSize: "28px", fontWeight: 800, color: totalLost > 0 ? "#0fff95" : "#748cab"}}>{totalLost > 0 ? `-${totalLost.toFixed(1)}` : "0"}</div><div style={{fontSize: "9px", color: "#748cab", textTransform: "uppercase"}}>Lost (lb)</div></div>
          <div><div style={{fontSize: "28px", fontWeight: 800, color: "#f0a500"}}>{startWeight}</div><div style={{fontSize: "9px", color: "#748cab", textTransform: "uppercase"}}>Start (lb)</div></div>
        </div>

        {/* Mini trend */}
        {weights.length > 1 && (
          <div style={{height: "60px", display: "flex", alignItems: "flex-end", gap: "3px", marginBottom: "12px"}}>
            {weights.slice(-20).map((w, i, arr) => {
              const min = Math.min(...arr.map(x => x.weight));
              const max = Math.max(...arr.map(x => x.weight));
              const range = max - min || 1;
              const h = Math.max(8, ((w.weight - min) / range) * 52);
              return <div key={w.id} style={{flex: 1, height: `${h}px`, borderRadius: "2px", background: i === arr.length - 1 ? accent : "rgba(139,92,246,0.3)", transition: "height 0.3s"}} />;
            })}
          </div>
        )}

        <div style={{display: "flex", gap: "8px"}}>
          <input type="number" step="0.1" placeholder="Weight (lb)" value={weightInput} onChange={e => setWeightInput(e.target.value)} style={{flex: 1, padding: "10px", borderRadius: "8px", border: `1px solid ${accent}30`, background: `${accent}08`, color: "#fff", fontSize: "13px", fontFamily: "inherit", boxSizing: "border-box"}} />
          <button onClick={addWeight} style={{padding: "10px 16px", borderRadius: "8px", border: "none", background: accent, color: "#fff", fontSize: "12px", fontWeight: 800, cursor: "pointer", fontFamily: "inherit"}}>Log</button>
        </div>

        {weights.length > 0 && (
          <div style={{marginTop: "12px", maxHeight: "120px", overflow: "auto"}}>
            {[...weights].reverse().slice(0, 8).map(w => (
              <div key={w.id} style={{display: "flex", justifyContent: "space-between", padding: "4px 0", fontSize: "11px"}}>
                <span style={{color: "#748cab"}}>{w.date}</span>
                <span style={{color: "#fff", fontWeight: 600}}>{w.weight} lb</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* PRs */}
      <div style={card()}>
        <div style={sLabel("#e94560")}>Personal Records</div>
        {Object.keys(prs).length === 0 ? (
          <div style={{textAlign: "center", padding: "16px 0", color: "#4a5568", fontSize: "13px"}}>No PRs logged yet.</div>
        ) : (
          Object.entries(prs).map(([name, pr]) => (
            <div key={name} style={{display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid rgba(255,255,255,0.04)"}}>
              <div><div style={{fontSize: "13px", fontWeight: 600, color: "#fff"}}>{name}</div><div style={{fontSize: "10px", color: "#748cab", marginTop: "2px"}}>{pr.date}</div></div>
              <div style={{fontSize: "16px", fontWeight: 800, color: "#e94560"}}>{pr.weight} lb 🏆</div>
            </div>
          ))
        )}
        <div style={{marginTop: "12px", borderTop: "1px solid rgba(255,255,255,0.04)", paddingTop: "12px"}}>
          <select value={prExercise} onChange={e => setPrExercise(e.target.value)} style={{width: "100%", padding: "10px", borderRadius: "8px", border: "1px solid rgba(233,69,96,0.2)", background: "#1a1a2e", color: "#fff", fontSize: "13px", fontFamily: "inherit", marginBottom: "8px", appearance: "auto"}}>
            <option value="">Select exercise...</option>
            {allExercises.map(e => <option key={e} value={e}>{e}</option>)}
          </select>
          <div style={{display: "flex", gap: "8px"}}>
            <input type="number" placeholder="Weight (lb)" value={prWeight} onChange={e => setPrWeight(e.target.value)} style={{flex: 1, padding: "10px", borderRadius: "8px", border: "1px solid rgba(233,69,96,0.2)", background: "rgba(233,69,96,0.05)", color: "#fff", fontSize: "13px", fontFamily: "inherit", boxSizing: "border-box"}} />
            <button onClick={addPR} style={{padding: "10px 16px", borderRadius: "8px", border: "none", background: "#e94560", color: "#fff", fontSize: "12px", fontWeight: 800, cursor: "pointer", fontFamily: "inherit"}}>Log PR</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ───
function WorkoutApp() {
  const [activeTab, setActiveTab] = useState("workout");
  const [selectedDay, setSelectedDay] = useState(getTodayIndex());
  const defaultData = {
    sets: {}, days: {}, steps: {}, activities: {}, meals: {}, weights: [], prs: {},
    badges: [], // { month, year, label, icon, color, woPct, calPct }
    popupDismissed: {}, // { "weekly-2026-05-18": true, "monthly-2026-06": true }
  };
  const [data, _setData] = useState(() => loadData() || defaultData);
  const setData = (fn) => _setData(prev => { const next = typeof fn === "function" ? fn(prev) : fn; saveData(next); return next; });
  const [showPopup, setShowPopup] = useState(null); // "weekly" | "monthly" | null

  // Auto-popup logic: weekly on Sunday, monthly on the 1st
  useEffect(() => {
    const now = new Date();
    const dow = now.getDay(); // 0 = Sunday
    const dom = now.getDate();
    const wk = getWeekStart(now);
    const monthKey = `monthly-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    const weekKey = `weekly-${wk}`;

    if (dom === 1 && !data.popupDismissed[monthKey]) {
      setShowPopup("monthly");
    } else if (dow === 0 && !data.popupDismissed[weekKey]) {
      setShowPopup("weekly");
    }
  }, []); // eslint-disable-line

  const dismissPopup = useCallback((type) => {
    const now = new Date();
    const wk = getWeekStart(now);
    const key = type === "weekly" ? `weekly-${wk}` : `monthly-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    setData(p => ({...p, popupDismissed: {...p.popupDismissed, [key]: true}}));
    setShowPopup(null);
  }, []);

  // Earn monthly badge on the 1st
  useEffect(() => {
    const now = new Date();
    if (now.getDate() !== 1) return;
    const prevMonth = now.getMonth() === 0 ? 11 : now.getMonth() - 1;
    const prevYear = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
    const prevMonthName = new Date(prevYear, prevMonth, 1).toLocaleString("default", {month:"long"});
    const badgeKey = `${prevYear}-${prevMonth}`;
    if (data.badges.some(b => b.key === badgeKey)) return;
    const daysInPrev = new Date(prevYear, prevMonth + 1, 0).getDate();
    let woDays = 0, calDays = 0, totalDays = 0;
    for (let d = 1; d <= daysInPrev; d++) {
      const dt = new Date(prevYear, prevMonth, d);
      const dw = dt.getDay();
      const dayIdx = dw === 0 ? 6 : dw - 1;
      const wkk = getWeekStart(dt);
      const dk = `${wkk}-${dayIdx}`;
      const wo = WORKOUT_PLAN[dayIdx];
      const isRest = wo.type === "rest";
      const woDone = isRest || data.days[dk] || false;
      const meals = data.meals[dk] || [];
      const cal = meals.reduce((a,m) => a + m.cal, 0);
      const calHit = cal > 0 && Math.abs(cal - TARGETS.calories) / TARGETS.calories <= 0.05;
      totalDays++; if (woDone) woDays++; if (calHit) calDays++;
    }
    const woPct = totalDays > 0 ? Math.round((woDays/totalDays)*100) : 0;
    const calPct = totalDays > 0 ? Math.round((calDays/totalDays)*100) : 0;
    let badge = null;
    if (woPct === 100) badge = {icon:"🥇",label:"Gold",color:"#f0a500"};
    else if (woPct >= 95) badge = {icon:"🥈",label:"Silver",color:"#c0c0c0"};
    else if (woPct >= 90) badge = {icon:"🥉",label:"Bronze",color:"#cd7f32"};
    if (badge) {
      setData(p => ({...p, badges: [...p.badges, {key:badgeKey,month:prevMonthName,year:prevYear,...badge,woPct,calPct}]}));
    }
  }, []); // eslint-disable-line

  const typeColors = { lift: { a: "#e94560" }, cardio: { a: "#0fff95" }, rest: { a: "#748cab" } };
  const dayAccent = (i) => typeColors[WORKOUT_PLAN[i].type].a;
  const tabColors = { workout: "#e94560", nutrition: "#f0a500", progress: "#8b5cf6" };

  return (
    <div style={{fontFamily: FONT, background: "#0d0d1a", minHeight: "100vh", color: "#e0e0e0", paddingBottom: "80px"}}>
      <div style={{background: "linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 100%)", padding: "20px 16px 12px", borderBottom: "1px solid rgba(255,255,255,0.06)"}}>
        <div style={{fontSize: "10px", textTransform: "uppercase", letterSpacing: "3px", color: "#748cab", marginBottom: "4px"}}>Summer Cut</div>
        <div style={{fontSize: "22px", fontWeight: 700, color: "#fff", marginBottom: "16px"}}>
          {activeTab === "workout" ? "Training" : activeTab === "nutrition" ? "Nutrition" : "Progress"}
        </div>

        {activeTab !== "progress" && (
          <div style={{display: "flex", gap: "4px", marginBottom: "12px"}}>
            {DAY_NAMES.map((day, i) => {
              const isToday = i === getTodayIndex();
              const isSelected = i === selectedDay;
              const sc = activeTab === "nutrition" ? "#f0a500" : dayAccent(i);
              return (
                <button key={i} onClick={() => setSelectedDay(i)} style={{
                  flex: 1, padding: "8px 0", border: isSelected ? `2px solid ${sc}` : "2px solid transparent",
                  borderRadius: "8px", background: isSelected ? `${sc}15` : "rgba(255,255,255,0.03)",
                  color: isSelected ? sc : "#748cab", fontSize: "11px", fontWeight: isSelected ? 700 : 500,
                  cursor: "pointer", position: "relative", fontFamily: "inherit", transition: "all 0.2s",
                }}>
                  {day}
                  {isToday && <div style={{width: "4px", height: "4px", borderRadius: "50%", background: sc, margin: "3px auto 0"}} />}
                </button>
              );
            })}
          </div>
        )}

        <div style={{display: "flex", gap: "4px", background: "rgba(255,255,255,0.03)", borderRadius: "10px", padding: "3px"}}>
          {[{id:"workout",label:"🏋️ Workout",clr:"#e94560"},{id:"nutrition",label:"🍽️ Nutrition",clr:"#f0a500"},{id:"progress",label:"📈 Progress",clr:"#8b5cf6"}].map(tab => (
            <button key={tab.id} onClick={() => setActiveTab(tab.id)} style={{
              flex: 1, padding: "10px", borderRadius: "8px", border: "none",
              background: activeTab === tab.id ? `${tab.clr}20` : "transparent",
              color: activeTab === tab.id ? tab.clr : "#4a5568",
              fontSize: "11px", fontWeight: 700, cursor: "pointer", fontFamily: "inherit", transition: "all 0.2s",
            }}>{tab.label}</button>
          ))}
        </div>
      </div>

      <div style={{padding: "16px"}}>
        {activeTab === "workout" && <WorkoutTab selectedDay={selectedDay} data={data} setData={setData} />}
        {activeTab === "nutrition" && <NutritionTab selectedDay={selectedDay} data={data} setData={setData} />}
        {activeTab === "progress" && <ProgressTab data={data} setData={setData} />}
      </div>

      {/* Weekly Summary Popup (Sundays) */}
      {showPopup === "weekly" && (() => {
        const wk = getWeekStart(new Date());
        const getDayData = (i) => {
          const dk = `${wk}-${i}`; const wo = WORKOUT_PLAN[i]; const isRest = wo.type === "rest";
          const woDone = isRest || data.days[dk] || false;
          const meals = data.meals[dk] || []; const cal = meals.reduce((a,m) => a + m.cal, 0);
          const calHit = cal > 0 && Math.abs(cal - TARGETS.calories) / TARGETS.calories <= 0.05;
          const steps = data.steps[dk] || 0;
          return { isRest, woDone, cal, calHit, steps, name: wo.name };
        };
        const days = Array.from({length:7},(_,i)=>({...getDayData(i),idx:i}));
        const woCount = days.filter(d=>!d.isRest&&d.woDone).length;
        const calCount = days.filter(d=>d.calHit).length;
        const stepCount = days.filter(d=>d.steps>=10000).length;
        const score = Math.round(((woCount/6)*50+(calCount/7)*30+(stepCount/7)*20));
        const grade = score>=90?"A":score>=80?"B":score>=70?"C":score>=60?"D":"F";
        const gc = grade==="A"?"#0fff95":grade==="B"?"#f0a500":"#e94560";
        return (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
            <div style={{background:"#1a1a2e",borderRadius:"20px",padding:"32px 24px",maxWidth:"360px",width:"100%",border:"1px solid rgba(139,92,246,0.3)",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
              <div style={{textAlign:"center",marginBottom:"24px"}}>
                <div style={{fontSize:"10px",textTransform:"uppercase",letterSpacing:"3px",color:"#8b5cf6",marginBottom:"8px"}}>Weekly Summary</div>
                <div style={{fontSize:"72px",fontWeight:900,color:gc,lineHeight:1}}>{grade}</div>
                <div style={{fontSize:"13px",color:"#748cab",marginTop:"8px"}}>Score: {score}/100</div>
              </div>
              <div style={{display:"flex",justifyContent:"space-around",textAlign:"center",marginBottom:"20px"}}>
                <div><div style={{fontSize:"22px",fontWeight:800,color:"#e94560"}}>{woCount}/6</div><div style={{fontSize:"9px",color:"#748cab",textTransform:"uppercase"}}>Workouts</div></div>
                <div><div style={{fontSize:"22px",fontWeight:800,color:"#f0a500"}}>{calCount}/7</div><div style={{fontSize:"9px",color:"#748cab",textTransform:"uppercase"}}>Nutrition</div></div>
                <div><div style={{fontSize:"22px",fontWeight:800,color:"#0fff95"}}>{stepCount}/7</div><div style={{fontSize:"9px",color:"#748cab",textTransform:"uppercase"}}>Steps</div></div>
              </div>
              <div style={{marginBottom:"20px"}}>
                {days.map(d=>(
                  <div key={d.idx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.04)",fontSize:"12px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:"8px"}}><span style={{color:"#fff",fontWeight:600,width:"28px"}}>{DAY_NAMES[d.idx]}</span><span style={{color:"#748cab"}}>{d.name}</span></div>
                    <div style={{display:"flex",gap:"4px"}}>
                      {!d.isRest&&<span style={{color:d.woDone?"#0fff95":"#4a5568"}}>{d.woDone?"✓":"○"}</span>}
                      <span style={{color:d.calHit?"#f0a500":"#4a5568"}}>{d.calHit?"✓":"○"}</span>
                    </div>
                  </div>
                ))}
              </div>
              <button onClick={()=>dismissPopup("weekly")} style={{width:"100%",padding:"14px",borderRadius:"12px",border:"none",background:"linear-gradient(135deg,#8b5cf6,#6d28d9)",color:"#fff",fontSize:"14px",fontWeight:800,cursor:"pointer",fontFamily:FONT,letterSpacing:"1px",textTransform:"uppercase"}}>Let's Go</button>
            </div>
          </div>
        );
      })()}

      {/* Monthly Report Popup (1st of month) */}
      {showPopup === "monthly" && (() => {
        const now = new Date();
        const prevMonth = now.getMonth() === 0 ? 11 : now.getMonth() - 1;
        const prevYear = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
        const prevMonthName = new Date(prevYear, prevMonth, 1).toLocaleString("default",{month:"long"});
        const daysInPrev = new Date(prevYear, prevMonth + 1, 0).getDate();
        let woDays=0, calDays=0, totalDays=0;
        for (let d=1;d<=daysInPrev;d++) {
          const dt=new Date(prevYear,prevMonth,d); const dw=dt.getDay();
          const dayIdx=dw===0?6:dw-1; const wkk=getWeekStart(dt); const dk=`${wkk}-${dayIdx}`;
          const wo=WORKOUT_PLAN[dayIdx]; const isRest=wo.type==="rest";
          const woDone=isRest||data.days[dk]||false;
          const meals=data.meals[dk]||[]; const cal=meals.reduce((a,m)=>a+m.cal,0);
          const calHit=cal>0&&Math.abs(cal-TARGETS.calories)/TARGETS.calories<=0.05;
          totalDays++; if(woDone) woDays++; if(calHit) calDays++;
        }
        const woPct=totalDays>0?Math.round((woDays/totalDays)*100):0;
        const calPct=totalDays>0?Math.round((calDays/totalDays)*100):0;
        const badge=woPct===100?{icon:"🥇",label:"Gold",color:"#f0a500"}:woPct>=95?{icon:"🥈",label:"Silver",color:"#c0c0c0"}:woPct>=90?{icon:"🥉",label:"Bronze",color:"#cd7f32"}:null;
        return (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
            <div style={{background:"#1a1a2e",borderRadius:"20px",padding:"32px 24px",maxWidth:"360px",width:"100%",border:"1px solid rgba(139,92,246,0.3)",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
              <div style={{textAlign:"center",marginBottom:"24px"}}>
                <div style={{fontSize:"10px",textTransform:"uppercase",letterSpacing:"3px",color:"#8b5cf6",marginBottom:"8px"}}>Monthly Report</div>
                <div style={{fontSize:"20px",fontWeight:800,color:"#fff"}}>{prevMonthName} {prevYear}</div>
                {badge&&<div style={{marginTop:"16px"}}><div style={{fontSize:"56px"}}>{badge.icon}</div><div style={{fontSize:"12px",color:badge.color,fontWeight:700,textTransform:"uppercase",marginTop:"4px"}}>{badge.label} Badge Earned!</div></div>}
                {!badge&&<div style={{marginTop:"16px",fontSize:"13px",color:"#748cab"}}>Keep pushing -- 90%+ earns a badge next month!</div>}
              </div>
              <div style={{display:"flex",justifyContent:"space-around",textAlign:"center",marginBottom:"24px",padding:"16px",background:"rgba(255,255,255,0.03)",borderRadius:"12px"}}>
                <div><div style={{fontSize:"28px",fontWeight:800,color:"#0fff95"}}>{woPct}%</div><div style={{fontSize:"9px",color:"#748cab",textTransform:"uppercase"}}>Workouts</div></div>
                <div><div style={{fontSize:"28px",fontWeight:800,color:"#f0a500"}}>{calPct}%</div><div style={{fontSize:"9px",color:"#748cab",textTransform:"uppercase"}}>Nutrition</div></div>
                <div><div style={{fontSize:"28px",fontWeight:800,color:"#8b5cf6"}}>{woDays}</div><div style={{fontSize:"9px",color:"#748cab",textTransform:"uppercase"}}>Days Trained</div></div>
              </div>
              <button onClick={()=>dismissPopup("monthly")} style={{width:"100%",padding:"14px",borderRadius:"12px",border:"none",background:"linear-gradient(135deg,#8b5cf6,#6d28d9)",color:"#fff",fontSize:"14px",fontWeight:800,cursor:"pointer",fontFamily:FONT,letterSpacing:"1px",textTransform:"uppercase"}}>New Month, Let's Go</button>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById("root")).render(<WorkoutApp />);
  </script>
